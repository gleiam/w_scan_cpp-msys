name: MSYS2 build (w_scan_cpp)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # setup-msys2-Doku: autocrlf VOR checkout abschalten, sonst CRLF in .sh-Dateien
      - name: CRLF-Autokonvertierung abschalten
        run: git config --global core.autocrlf input
        shell: pwsh

      - name: Checkout
        uses: actions/checkout@v5

      # https://www.msys2.org/docs/ci/ – MSYS statt UCRT64, da msys-Toolchain (kein MinGW)
      - name: MSYS2 einrichten (MSYS, Update + Pakete)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            msys2-devel
            pkgconf
            libcurl-devel openssl-devel zlib-devel
            gettext-devel
            libzstd-devel libidn2-devel libpsl-devel brotli-devel libnghttp2-devel
            dos2unix wget unzip
          cache: true
          path-type: minimal
          release: true

      - name: Pipeline (Patches, Vendor, librepfunc, Build, Gate, Paket, Smoke)
        run: |
          set -euo pipefail
          bash tools/build.sh --skip-install

      - name: Paket-Metadaten anhaengen
        run: |
          set -euo pipefail
          pacman -Q > dist/w_scan_cpp-msys-x86_64/msys-packages.txt
          gcc -dumpmachine >> dist/w_scan_cpp-msys-x86_64/msys-packages.txt

      - name: --help-Gate (dist-Build lauffaehig)
        run: |
          set -euo pipefail
          ./dist/w_scan_cpp-msys-x86_64/w_scan_cpp.exe --help > dist-help.txt
          grep -q "w_scan_cpp Version" dist-help.txt

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: w_scan_cpp-msys-x86_64
          path: dist/w_scan_cpp-msys-x86_64

      # Doku-FAQ: haengende msys-Prozesse (gnupg u.a.) am Ende killen
      - name: MSYS-Restprozesse beenden
        if: always()
        run: taskkill /F /FI "MODULES eq msys-2.0.dll"
        shell: pwsh
